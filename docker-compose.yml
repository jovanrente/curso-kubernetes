version: '3.8'

services:
  mysql8:
    container_name: mysql8
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: msvc_usuario
    volumes:
      - mysql8_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - spring
    restart: always

  msvc-usuario:
    container_name: msvc-usuarios
    image: jovanrente/usuario:latest
    ports:
      - "8001:8001"
    environment:
      DB_HOST: mysql8
      DB_PORT: 3306
      DB_NAME: msvc_usuario
      DB_USER: root
      DB_PASSWORD: admin
    depends_on:
      - mysql8
    networks:
      - spring

  msvc-cursos:
    container_name: msvc-cursos
    image: jovanrente/curso:latest
    ports:
      - "8002:8002"
    environment:
      DB_HOST: mysql8
      DB_PORT: 3306
      DB_NAME: msvc_cursos
      DB_USER: root
      DB_PASSWORD: admin
    depends_on:
      - mysql8
    networks:
      - spring


volumes:
  mysql8_data:
    name: mysql8_data

networks:
  spring:
    external: true
